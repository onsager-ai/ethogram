# Merge gate for the public wire contract. The language jobs keep each SDK
# honest; conformance proves that the two hand-written implementations agree.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Test
        run: pnpm -r test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # Cargo unifies features across a dependency graph, so a consumer that
      # enables serde_json's `preserve_order` anywhere enables it here too, and
      # it changes the map backing every payload. The canonical form must not
      # move. Without this run, that breakage is invisible to us and visible
      # only in the consumer's output.
      - name: Test under a consumer's preserve_order
        run: cargo test --features preserve-order-probe

  conformance:
    # This job is the mechanical proof behind repository principle 1.
    name: Cross-language conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compare SDK serialisation
        run: ./conformance/run.sh
